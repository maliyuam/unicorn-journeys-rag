name: Feature request
description: Suggest a capability or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The situation you hit, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: measurement
    attributes:
      label: How would we know it worked?
      description: >
        For anything touching retrieval, chunking, embeddings or prompts, the
        answer is usually a number from the evaluation harness. See
        docs/evaluation.md.
